<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070a11" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="50%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#ffd000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Dark Cyber -->
  <rect width="512" height="512" rx="100" fill="#070a11"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Anillos de Radar Táctico -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Líneas de Cruz Táctica -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6"/>

  <!-- Escudo Táctico Exterior -->
  <polygon points="256,70 390,130 390,290 256,430 122,290 122,130" 
           fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Marcadores en esquinas del escudo -->
  <circle cx="256" cy="70" r="6" fill="#00f0ff"/>
  <circle cx="390" cy="130" r="6" fill="#00f0ff"/>
  <circle cx="390" cy="290" r="6" fill="#ff2a5f"/>
  <circle cx="256" cy="430" r="6" fill="#ff2a5f"/>
  <circle cx="122" cy="290" r="6" fill="#ff2a5f"/>
  <circle cx="122" cy="130" r="6" fill="#00f0ff"/>

  <!-- Icono Central: Llama de Incendio & Rayo de Colisión Combinados -->
  <g transform="translate(156, 136) scale(0.39)" filter="url(#glow)">
    <!-- Llama de fuego -->
    <path d="M256 0 C256 0, 310 110, 310 180 C310 220, 290 250, 260 270 C280 230, 280 180, 250 140 C220 180, 210 230, 230 280 C180 260, 160 210, 160 160 C110 210, 90 290, 130 370 C160 430, 220 480, 290 480 C390 480, 470 400, 470 300 C470 190, 370 80, 256 0 Z" 
          fill="url(#flameGrad)" />
    <!-- Rayo de Impacto Accidental -->
    <polygon points="280,120 180,290 250,290 200,450 360,250 290,250 350,120" 
             fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Indicador Pulsante Live -->
  <circle cx="256" cy="460" r="7" fill="#00ff88">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
