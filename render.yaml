services:
  - type: web
    name: accident-detector
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: DEVICE
        value: cpu
      - key: CONFIDENCE_THRESHOLD
        value: 0.45
      - key: IOU_THRESHOLD
        value: 0.50
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_URL_NON_POOLING
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: incident-evidence
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: MAPS_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_PHONE
        sync: false
      - key: TWILIO_TO_PHONE
        sync: false
      - key: ENRICHMENT_SERVICE_URL
        sync: false
      - key: ENRICHMENT_SERVICE_API_KEY
        value: titan-secret-key-2026
